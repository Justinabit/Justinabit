<svg xmlns="http://www.w3.org/2000/svg" width="480" height="264" viewBox="0 0 480 264" role="img" aria-labelledby="title desc">
  <title id="title">Most used languages</title>
  <desc id="desc">JavaScript 42.7%, TypeScript 20.1%, Java 16.1%, CSS 9.6%, HTML 7.6%, PLpgSQL 2.4%, Python 1.6%</desc>
  <style>
  .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .m { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .fade { animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
  .pop { animation: pop .6s cubic-bezier(.3,1.4,.5,1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(1.6); } }
  .grow { animation: grow 1.4s cubic-bezier(.3,.8,.2,1) .2s both; transform-origin: 24px 0; }
      @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
